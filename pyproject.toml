[project]
name = "travel-planner-server"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "email-validator>=2.4.0",
    "fastapi>=0.165.0",
    "pydantic>=2,<3",
    "sqlalchemy>=2.1.9",
    "uvicorn>=0.54.0",
]

[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
py-modules = ["main", "models", "llm_models"]

[project.scripts]
serve = "main:serve"

[dependency-groups]
dev = [
    "python-dotenv>=1.2.4",
]
